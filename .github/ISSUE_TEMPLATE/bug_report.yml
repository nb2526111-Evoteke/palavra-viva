name: "Relatar um problema"
description: "Informe um bug ou comportamento inesperado no site ou no painel."
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Obrigado por ajudar a melhorar o Palavra Viva.
        Não inclua senhas, tokens, `.env` ou dados pessoais.
  - type: textarea
    id: descricao
    attributes:
      label: "O que aconteceu?"
      description: "Descreva o problema de forma objetiva."
    validations:
      required: true
  - type: textarea
    id: passos
    attributes:
      label: "Como reproduzir"
      placeholder: |
        1. Abra ...
        2. Clique em ...
        3. Veja o erro ...
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: "Comportamento esperado"
    validations:
      required: true
  - type: dropdown
    id: ambiente
    attributes:
      label: "Onde aconteceu?"
      options:
        - "Desenvolvimento local (SQLite)"
        - "Produção na Vercel"
        - "Produção em VPS"
        - "Outro"
    validations:
      required: true
  - type: input
    id: navegador
    attributes:
      label: "Navegador e dispositivo"
      placeholder: "Chrome 131 no Windows 11 / Safari no iPhone 15"
  - type: textarea
    id: logs
    attributes:
      label: "Logs ou capturas"
      description: "Cole apenas trechos relevantes, sem segredos."
